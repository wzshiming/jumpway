web_ui:
  host: 127.0.0.1
  port: 1088

rules:
  - name: default
    listen:
      host: 127.0.0.1
      port: 1087
    way:
      - lb:
          - http://xxxx:8080
          - socks5://yyy:1080
      - lb:
          - socks4://zzzz:8000

no_proxy:
  list:
    - 127.0.0.1
    - localhost
    - 192.168.0.0/16
    - 10.0.0.0/8
    - FE80::/64
    - ::1
    - FD00::/8

  from_env:
    - NO_PROXY
    - no_proxy