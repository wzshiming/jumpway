<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>JumpWay</title>
	<link rel="stylesheet" href="/style.css">
	<script src="/app.js" defer></script>
</head>
<body>
	<div class="page">
		<header class="header">
			<div class="identity">
				<h1 data-i18n="appName">JumpWay</h1>
				<div class="runtime" aria-live="polite">
					<span data-i18n="webUI"></span>
					<span id="status-dot" class="status-dot unknown" aria-hidden="true"></span>
					<span id="status-label" data-i18n="checking"></span>
					<a id="status-address" hidden></a>
					<span id="status-error" class="runtime-error"></span>
				</div>
			</div>
			<div class="header-actions">
				<span id="dirty-badge" class="badge" data-i18n="unsaved" hidden></span>
			</div>
		</header>
		<div id="rule-status" class="status-rules" aria-live="polite" data-i18n-aria="ruleTabs"></div>

		<nav id="page-nav" class="page-nav" role="tablist" data-i18n-aria="ruleTabs">
			<a href="#/stats" data-page="stats" data-i18n="stats" role="tab" aria-selected="false" aria-controls="page-panel" tabindex="-1"></a>
			<a href="#/settings" data-page="settings" data-i18n="settings" role="tab" aria-selected="false" aria-controls="page-panel" tabindex="-1"></a>
			<a href="#/yaml" data-page="yaml" data-i18n="yaml" role="tab" aria-selected="false" aria-controls="page-panel" tabindex="-1"></a>
		</nav>

		<div class="feedback">
			<p id="activity" class="activity" role="status" aria-live="polite"></p>
			<div id="moved-banner" class="message notice" role="status" hidden>
				<span id="moved-message" data-i18n="movedTo"></span>
				<a id="moved-link"></a>
			</div>
			<div id="unreachable-banner" class="message warning" role="status" hidden>
				<strong data-i18n="unreachable"></strong>
				<p data-i18n="recoveryHint"></p>
			</div>
		</div>

		<main id="main" aria-busy="true"></main>

		<footer>
			<span data-i18n="appName"></span>
			<nav data-i18n-aria="resources">
				<a href="/swaggerui/" data-i18n="apiDocs"></a>
				<a href="/debug/pprof/" data-i18n="pprof"></a>
				<a href="/metrics" data-i18n="prometheus"></a>
				<a href="https://github.com/wzshiming/jumpway" target="_blank" rel="noopener noreferrer" data-i18n="github"></a>
			</nav>
		</footer>
	</div>

	<dialog id="url-builder" aria-labelledby="builder-title">
		<form id="builder-form" autocomplete="off" novalidate>
			<h2 id="builder-title" data-i18n="builderTitle"></h2>
			<div class="field">
				<label for="builder-protocol" data-i18n="protocol"></label>
				<select id="builder-protocol" disabled></select>
			</div>
			<div id="builder-fields" class="builder-fields"></div>
			<div class="builder-preview">
				<label id="builder-preview-label" for="builder-preview" data-i18n="preview"></label>
				<output id="builder-preview" aria-labelledby="builder-preview-label"></output>
			</div>
			<p id="builder-hint" class="hint" role="status"></p>
			<div class="builder-actions">
				<button id="builder-cancel" type="button" data-i18n="cancel"></button>
				<button id="builder-use" class="primary" type="submit" data-i18n="useURL" aria-describedby="builder-hint" disabled></button>
			</div>
		</form>
	</dialog>

	<template id="builder-field-template">
		<div class="field">
			<label><span class="builder-field-name"></span> <span class="optional" data-i18n="optional" hidden></span></label>
		</div>
	</template>
	<template id="builder-input-template">
		<input type="text" spellcheck="false" autocomplete="off" autocapitalize="none">
	</template>
	<template id="builder-select-template">
		<select></select>
	</template>

	<template id="page-template">
		<section id="page-panel" class="section" role="tabpanel" aria-labelledby="page-heading">
			<div class="section-heading"><h2 id="page-heading" tabindex="-1"></h2></div>
			<div id="request-error" class="message error" role="alert" hidden>
				<strong data-i18n="requestFailed"></strong>
				<pre id="request-error-text"></pre>
				<button id="retry" type="button" data-i18n="retry" hidden></button>
			</div>
			<div id="page-content"></div>
		</section>
	</template>

	<template id="rules-template">
		<div class="rules-page">
			<section id="rule-panel" aria-labelledby="page-heading">
				<form id="rule-form" autocomplete="off" novalidate>
					<fieldset id="page-fields">
						<p id="no-rules" class="hint" data-i18n="noRules" hidden></p>
						<div class="rule-fields">
							<div class="field">
								<label for="rule-name" data-i18n="rule"></label>
								<input id="rule-name" type="text" spellcheck="false" required>
							</div>
							<label class="enabled-field"><input id="rule-enabled" type="checkbox" checked><span data-i18n="enabled"></span></label>
						</div>
						<section class="rule-section" aria-labelledby="entry-heading">
							<h3 id="entry-heading" data-i18n="entry"></h3>
							<div class="entry-fields">
								<div class="field">
									<label for="listen-host" data-i18n="host"></label>
									<input id="listen-host" type="text" placeholder="127.0.0.1" spellcheck="false">
								</div>
								<div class="field">
									<label for="listen-port" data-i18n="port"></label>
									<input id="listen-port" type="number" min="0" max="65535" step="1" inputmode="numeric" required>
								</div>
								<div class="field">
									<label for="listen-username" data-i18n="username"></label>
									<input id="listen-username" type="text" spellcheck="false" aria-describedby="credentials-hint">
								</div>
								<div class="field">
									<label for="listen-password" data-i18n="password"></label>
									<input id="listen-password" type="password" autocomplete="new-password" aria-describedby="credentials-hint">
								</div>
							</div>
							<p id="credentials-hint" class="hint" data-i18n="credentialsHint"></p>
							<div id="listen-editor" class="hop-editor">
								<h4 data-i18n="listenThrough"></h4>
								<p id="listen-through-hint" class="hint" data-i18n="listenThroughHint"></p>
								<div class="hops" aria-describedby="listen-through-hint"></div>
								<button class="add-hop add-button" type="button" data-i18n="addHop"></button>
							</div>
						</section>
						<section class="rule-section" aria-labelledby="exit-heading">
							<h3 id="exit-heading" data-i18n="exit"></h3>
							<fieldset id="rule-mode" class="mode-field">
								<legend data-i18n="mode"></legend>
								<div class="mode-options">
									<label><input id="mode-proxy" type="radio" name="mode" value="proxy" checked><span data-i18n="proxy"></span></label>
									<label><input id="mode-forward" type="radio" name="mode" value="forward"><span data-i18n="portForward"></span></label>
								</div>
							</fieldset>
							<fieldset id="target-fields" class="address-fields" disabled hidden>
								<div class="field">
									<label for="target-host" data-i18n="targetHost"></label>
									<input id="target-host" type="text" placeholder="127.0.0.1" spellcheck="false" aria-describedby="target-host-hint">
									<p id="target-host-hint" class="hint" data-i18n="onExitNode"></p>
								</div>
								<div class="field">
									<label for="target-port" data-i18n="targetPort"></label>
									<input id="target-port" type="number" min="1" max="65535" step="1" inputmode="numeric" required>
								</div>
							</fieldset>
							<div id="exit-editor" class="hop-editor">
								<h4 data-i18n="exitChain"></h4>
								<p id="exit-hint" class="hint" data-i18n="hopsHint"></p>
								<p class="chain-summary"></p>
								<div class="hops" aria-describedby="exit-hint"></div>
								<button class="add-hop add-button" type="button" data-i18n="addHop"></button>
							</div>
						</section>
						<div id="connections-slot"></div>
						<div class="page-actions">
							<button id="save" class="primary" type="submit" data-i18n="saveApply"></button>
							<button id="delete-rule" class="danger" type="button" data-i18n="deleteRule"></button>
						</div>
					</fieldset>
				</form>
			</section>
		</div>
	</template>

	<template id="rule-stats-template">
		<div id="rule-stats" class="stats-strip" role="group" data-i18n-aria="stats">
			<div class="stat">
				<span class="stat-label" data-i18n="rateUp"></span><strong class="stat-value" data-stat="rate_up"></strong>
				<span class="stat-sub" data-i18n="rateWindow"></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="rateDown"></span><strong class="stat-value" data-stat="rate_down"></strong>
				<span class="stat-sub" data-i18n="rateWindow"></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="totalUp"></span><strong class="stat-value" data-stat="up"></strong>
				<span class="stat-sub" data-i18n="statsLifetime"></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="totalDown"></span><strong class="stat-value" data-stat="down"></strong>
				<span class="stat-sub" data-i18n="statsLifetime"></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="connections"></span><strong class="stat-value" data-stat="connections"></strong>
				<span class="stat-sub"><span data-i18n="activeConns"></span> / <span data-i18n="totalConns"></span></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="latency"></span><strong class="stat-value" data-stat="latency_ms"></strong>
				<span class="stat-sub"><span data-i18n="avgLatency"></span> <span data-stat="avg_latency_ms"></span></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="dialFailures"></span><strong class="stat-value" data-stat="dial_failures"></strong>
				<span class="stat-sub"><span data-stat="dials"></span> <span data-i18n="dialAttempts"></span></span>
			</div>
			<div class="stat">
				<span class="stat-label" data-i18n="lastActive"></span><strong class="stat-value" data-stat="last_active"></strong>
				<span class="stat-sub" data-stat="last_active_time"></span>
			</div>
		</div>
	</template>

	<template id="connections-template">
		<section class="rule-section" aria-labelledby="connections-heading">
			<h3 id="connections-heading" data-i18n="currentConnections"></h3>
			<div id="connections-table" class="stats-scroll" role="region" tabindex="0" aria-labelledby="connections-heading" hidden>
				<table class="stats-table">
					<thead><tr>
						<th scope="col" data-i18n="client"></th>
						<th scope="col" data-i18n="target"></th><th scope="col" data-i18n="via"></th>
						<th scope="col" class="number" data-i18n-title="rateUp" data-i18n-aria="rateUp">&#8593; /s</th>
						<th scope="col" class="number" data-i18n-title="rateDown" data-i18n-aria="rateDown">&#8595; /s</th>
						<th scope="col" class="number" data-i18n-title="totalUp" data-i18n-aria="totalUp">&#8593; <span data-i18n="totalShort"></span></th>
						<th scope="col" class="number" data-i18n-title="totalDown" data-i18n-aria="totalDown">&#8595; <span data-i18n="totalShort"></span></th>
						<th scope="col" class="number" data-i18n="duration"></th>
						<th scope="col"><span class="sr-only" data-i18n="disconnect"></span></th>
					</tr></thead>
					<tbody id="connection-rows"></tbody>
				</table>
			</div>
			<p id="no-connections" class="hint" data-i18n="noConnections"></p>
			<p id="connections-note" class="hint" hidden></p>
		</section>
	</template>

	<template id="connection-row-template">
		<tr>
			<td class="connection-client address"></td>
			<th scope="row" class="connection-target address"></th><td class="connection-via address"></td>
			<td class="number" data-stat="rate_up"></td><td class="number" data-stat="rate_down"></td>
			<td class="number" data-stat="up"></td><td class="number" data-stat="down"></td>
			<td class="number connection-duration"></td>
			<td class="connection-action"><button class="disconnect-connection danger" type="button" data-i18n="disconnect"></button></td>
		</tr>
	</template>

	<template id="rule-tab-template">
		<a role="tab" aria-selected="false" aria-controls="page-panel" tabindex="-1">
			<span class="tab-name"></span>
		</a>
	</template>

	<template id="stats-template">
		<div class="stats-page">
			<div class="stats-toolbar">
				<p id="stats-since" class="hint"></p>
				<div class="stats-actions">
					<a href="/metrics" data-i18n="prometheus"></a>
					<button id="reset-stats" type="button" data-i18n="resetStats"></button>
				</div>
			</div>
			<div id="stats-table" class="stats-scroll" role="region" tabindex="0" aria-labelledby="page-heading">
				<table class="stats-table">
					<thead><tr>
						<th scope="col" data-i18n="rule"></th><th scope="col" data-i18n="state"></th><th scope="col" data-i18n="address"></th>
						<th scope="col" class="number" data-i18n-title="rateUp" data-i18n-aria="rateUp">&#8593; /s</th>
						<th scope="col" class="number" data-i18n-title="rateDown" data-i18n-aria="rateDown">&#8595; /s</th>
						<th scope="col" class="number" data-i18n-title="totalUp" data-i18n-aria="totalUp">&#8593;</th>
						<th scope="col" class="number" data-i18n-title="totalDown" data-i18n-aria="totalDown">&#8595;</th>
						<th scope="col" class="number"><span data-i18n="connections"></span><span class="table-sub" data-i18n="connectionsOrder"></span></th>
						<th scope="col" class="number"><span data-i18n="latency"></span><span class="table-sub" data-i18n="latencyOrder"></span></th>
						<th scope="col" class="number" data-i18n="dialFailures"></th>
					</tr></thead>
					<tbody id="stats-rows"></tbody>
				</table>
			</div>
			<p id="stats-empty" class="hint" data-i18n="noRules" hidden></p>
		</div>
	</template>

	<template id="stats-row-template">
		<tr>
			<th scope="row"><a class="stats-rule"></a></th>
			<td><span class="rule-chip"><span class="status-dot" aria-hidden="true"></span><span class="chip-state"></span></span></td>
			<td class="stats-address address"></td>
			<td class="number" data-stat="rate_up"></td><td class="number" data-stat="rate_down"></td>
			<td class="number" data-stat="up"></td><td class="number" data-stat="down"></td>
			<td class="number" data-stat="connections"></td><td class="number" data-stat="latency"></td>
			<td class="number" data-stat="dial_failures"></td>
		</tr>
	</template>

	<template id="new-tab-template">
		<a id="new-rule-tab" href="#/rules" role="tab" aria-selected="false" aria-controls="page-panel" tabindex="-1" data-i18n-aria="newRule" data-i18n-title="newRule">+</a>
	</template>

	<template id="rule-status-template">
		<a class="rule-chip">
			<span class="status-dot" aria-hidden="true"></span>
			<span class="chip-label"></span>
			<span class="chip-state"></span>
			<span class="rule-marker" hidden></span>
		</a>
	</template>

	<template id="settings-template">
		<form id="settings-form" novalidate>
			<fieldset id="page-fields">
				<section class="settings-section" aria-labelledby="web-ui-heading">
					<h3 id="web-ui-heading" data-i18n="webUI"></h3>
					<div class="address-fields">
						<div class="field">
							<label for="web-ui-host" data-i18n="host"></label>
							<input id="web-ui-host" type="text" placeholder="127.0.0.1" spellcheck="false" autocomplete="off" aria-describedby="web-ui-hint">
						</div>
						<div class="field port-field">
							<label for="web-ui-port" data-i18n="port"></label>
							<input id="web-ui-port" type="number" min="0" max="65535" step="1" inputmode="numeric" aria-describedby="web-ui-hint" required>
						</div>
					</div>
					<p id="web-ui-hint" class="hint" data-i18n="webUIHint"></p>
				</section>
				<section class="settings-section" aria-labelledby="no-proxy-heading">
					<h3 id="no-proxy-heading" data-i18n="noProxy"></h3>
					<div class="no-proxy-fields">
						<div class="field">
							<label for="no-proxy-list" data-i18n="hostsCIDRs"></label>
							<textarea id="no-proxy-list" rows="8" spellcheck="false" aria-describedby="list-hint"></textarea>
							<p id="list-hint" class="hint" data-i18n="listHint"></p>
						</div>
						<div class="field">
							<label for="no-proxy-env" data-i18n="fromEnv"></label>
							<textarea id="no-proxy-env" rows="8" spellcheck="false" aria-describedby="env-hint"></textarea>
							<p id="env-hint" class="hint" data-i18n="envHint"></p>
						</div>
						<div class="field">
							<label for="no-proxy-files" data-i18n="fromFiles"></label>
							<textarea id="no-proxy-files" rows="8" spellcheck="false" aria-describedby="files-hint"></textarea>
							<p id="files-hint" class="hint" data-i18n="filesHint"></p>
						</div>
					</div>
				</section>
				<div class="page-actions"><button id="save" class="primary" type="submit" data-i18n="saveApply"></button></div>
			</fieldset>
		</form>
	</template>

	<template id="yaml-template">
		<form id="yaml-form" novalidate>
			<fieldset id="page-fields">
				<label for="yaml-source" class="yaml-label" data-i18n="yamlSource"></label>
				<textarea id="yaml-source" class="yaml" spellcheck="false" autocomplete="off" wrap="off"></textarea>
				<div class="page-actions">
					<button id="save" class="primary" type="submit" data-i18n="saveApply"></button>
					<button id="reload" type="button" data-i18n="reload"></button>
				</div>
			</fieldset>
		</form>
	</template>

	<template id="hop-template">
		<section class="hop">
			<div class="hop-header">
				<h4 class="hop-title"></h4>
				<div class="hop-actions">
					<button class="hop-up" type="button" data-i18n="up"></button>
					<button class="hop-down" type="button" data-i18n="down"></button>
					<button class="delete-hop danger" type="button" data-i18n="deleteHop"></button>
				</div>
				<p class="hop-stats" hidden></p>
			</div>
			<div class="url-rows"></div>
			<button class="add-url add-button" type="button" data-i18n="addURL"></button>
		</section>
	</template>

	<template id="url-template">
		<div class="url-row">
			<div class="field url-field">
				<label class="url-label" data-i18n="proxyURL"></label>
				<input class="proxy-url" type="text" placeholder="socks5://user:pass@host:1080" spellcheck="false" autocomplete="off">
			</div>
			<div class="url-actions">
				<span class="url-builder-slot" data-extension="url-builder">
					<button class="build-url" type="button" data-i18n="build" aria-haspopup="dialog" aria-controls="url-builder"></button>
				</span>
				<button class="remove-url danger" type="button" data-i18n="remove"></button>
			</div>
			<p class="url-stats" hidden></p>
		</div>
	</template>
</body>
</html>
